# Build the image, push it to ECR and roll the UAT ECS service.
name: Deploy — UAT

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - run: docker build -t ${{ steps.ecr.outputs.registry }}/harborline-portal:${{ github.sha }} . && docker push ${{ steps.ecr.outputs.registry }}/harborline-portal:${{ github.sha }}
      - run: aws ecs update-service --cluster harborline-uat --service web --force-new-deployment
