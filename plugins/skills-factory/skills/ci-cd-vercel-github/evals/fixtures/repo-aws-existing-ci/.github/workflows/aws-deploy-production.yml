# Production never builds: promote the UAT image by digest and roll the production ECS service.
name: Deploy — production (promote from UAT)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full commit SHA running on UAT"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: aws ecs update-service --cluster harborline-prod --service web --force-new-deployment
