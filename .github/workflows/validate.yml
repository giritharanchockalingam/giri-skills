name: validate-skills
on:
  push: { branches: [main] }
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Repo validator
        run: python3 scripts/validate.py
      - name: Script tests
        run: pip install -q pytest pandas openpyxl python-docx pypdf && python3 -m pytest -q tests/
      - name: Behavioral evals (dry)
        run: python3 scripts/behavioral_evals.py all --provider dry --skills 'skills/presales/*' --out evals/results/ci-dry
      - name: Agent evals (dry) — run every wired skill against its fixtures
        run: python3 scripts/behavioral_evals.py agent --provider dry --out evals/results/ci-agent
      - name: Vendor pins present
        run: python3 scripts/vendor_sync.py --check
      - name: Spec validator (agentskills.io skills-ref)
        continue-on-error: true
        run: |
          pip install -q skills-ref || exit 0
          for d in $(find skills -name SKILL.md -exec dirname {} \;); do skills-ref validate "$d" || true; done
      - name: Script syntax
        run: |
          python3 -m compileall -q skills scripts
          for f in $(find scripts skills -name '*.sh'); do bash -n "$f"; done
